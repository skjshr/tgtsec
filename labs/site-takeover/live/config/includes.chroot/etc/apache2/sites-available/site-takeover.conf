<VirtualHost *:80>
    ServerName 10.13.37.10
    DocumentRoot /srv/shop-site/public

    SetEnv SITE_NOTICE_PATH /srv/shop-site/data/announcement.txt

    Alias /start/ /srv/shop-site/guide/

    <Directory /srv/shop-site/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory /srv/shop-site/guide>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/site-takeover-error.log
    CustomLog ${APACHE_LOG_DIR}/site-takeover-access.log combined
</VirtualHost>

ServerTokens Prod
ServerSignature Off
