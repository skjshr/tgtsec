[global]
    interfaces = lo 10.13.37.10/24
    bind interfaces only = yes
    map to guest = Bad User
    guest account = nobody
    server min protocol = SMB2
    smb ports = 445
    log level = 1

[handover]
    comment = TRAINING ONLY - synthetic shift handover
    path = /srv/kazekiri/handover
    browseable = yes
    guest ok = yes
    read only = yes
    preexec = /usr/local/bin/open-world-event --kind entry.discovered --node entrance-smb-handover --source smbd.service --evidence smb.handover.connected
