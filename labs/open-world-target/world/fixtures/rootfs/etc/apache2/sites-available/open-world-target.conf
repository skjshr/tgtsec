Listen 10.13.37.10:80

<VirtualHost 10.13.37.10:80>
    ServerName target.examserver.test
    DocumentRoot /var/www/kazekiri

    <Directory /var/www/kazekiri>
        AllowOverride None
        Options -Indexes
        Require all granted
    </Directory>

    DirectoryIndex index.php
    ErrorLog /var/log/apache2/open-world-error.log
    CustomLog /var/log/apache2/open-world-access.log "%a %t %m %U %>s"
    LogLevel warn
</VirtualHost>
