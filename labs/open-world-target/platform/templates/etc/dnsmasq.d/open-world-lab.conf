# Direct-link DHCP only. DNS is disabled and no resolver is advertised.
interface={{WIRED_INTERFACE}}
except-interface=lo
bind-interfaces
port=0
dhcp-authoritative
dhcp-range=10.13.37.100,10.13.37.199,255.255.255.0,1h
dhcp-option=3
dhcp-option=6
dhcp-leasefile=/run/open-world-dnsmasq/dnsmasq.leases
log-dhcp
