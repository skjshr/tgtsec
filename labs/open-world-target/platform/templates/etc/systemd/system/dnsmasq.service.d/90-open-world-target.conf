[Unit]
PartOf=open-world-vulnerable.target

[Service]
ExecStartPre=
ExecStartPre=/usr/sbin/dnsmasq --test --conf-file=/etc/dnsmasq.d/open-world-lab.conf
ExecStart=
ExecStart=/usr/sbin/dnsmasq --user=dnsmasq --conf-file=/etc/dnsmasq.d/open-world-lab.conf --pid-file=/run/dnsmasq/dnsmasq.pid
ExecStartPost=
ExecStop=
RuntimeDirectory=dnsmasq
RuntimeDirectoryMode=0755
