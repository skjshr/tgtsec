name: Test

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Static and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Node tests
        run: npm --prefix labs/site-takeover test

      - name: Check Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            if head -n 1 "${file}" | grep -Eq '^#!.*(/|env )(ba)?sh([[:space:]]|$)'; then
              bash -n "${file}"
              checked=$((checked + 1))
            fi
          done < <(find labs/site-takeover -type f -print0)
          ((checked > 0))
          printf 'Checked %d shell scripts.\n' "${checked}"

      - name: Check PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v php >/dev/null
          checked=0
          while IFS= read -r -d '' file; do
            php -l "${file}"
            checked=$((checked + 1))
          done < <(find labs/site-takeover -type f -name '*.php' -print0)
          ((checked > 0))
          printf 'Checked %d PHP files.\n' "${checked}"

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          $files = @(Get-ChildItem -LiteralPath 'labs/site-takeover' -Recurse -File -Filter '*.ps1')
          if ($files.Count -eq 0) {
            throw 'No PowerShell scripts were found.'
          }

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            foreach ($parseError in @($errors)) {
              Write-Error "$($file.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

          Write-Host "Checked $($files.Count) PowerShell scripts."

      - name: Run safe Windows bootstrap self-test
        shell: pwsh
        run: ./labs/site-takeover/operator/company-bootstrap.ps1 -SelfTest
